<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0a">
  <title>Page not found | AERO-FOLD</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: #0a0a0a;
      color: #fff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    .mark {
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    .code {
      margin: 3rem 0 0;
      font-size: 0.65rem;
      letter-spacing: 0.4em;
      color: #71717a;
      text-transform: uppercase;
    }
    h1 {
      margin: 1rem 0 0;
      font-size: clamp(2.25rem, 8vw, 4.5rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }
    p {
      max-width: 28rem;
      margin: 1.5rem auto 0;
      color: #a1a1aa;
      font-size: 0.95rem;
      font-weight: 300;
      line-height: 1.7;
    }
    a {
      display: inline-block;
      margin-top: 2.25rem;
      padding: 1rem 1.5rem;
      background: #fff;
      color: #0a0a0a;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-decoration: none;
      text-transform: uppercase;
    }
    a:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <main>
    <div class="mark">AERO-FOLD</div>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page may have moved. Browse our foldable travel bags, or contact us for help choosing a packable duffel, weekender or carry-on tote.</p>
    <a href="/">Back to the collection</a>
  </main>
</body>
</html>
